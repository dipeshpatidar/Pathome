spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  application:
    name: pathome-spaces-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pathome_db}
    username: ${SPRING_DATASOURCE_USERNAME:pathome}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

meta:
  webhook:
    verify-token: ${META_VERIFY_TOKEN:PATHOME_META_VERIFY_TOKEN_2026}
  graph:
    api:
      token: ${META_GRAPH_TOKEN:MOCK_META_GRAPH_API_TOKEN}

server:
  port: 8080


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:hbgzetjy}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

pathome:
  visit:
    auto-shift-threshold-minutes: ${PATHOME_VISIT_AUTO_SHIFT_THRESHOLD_MINUTES:10}
    reservation-horizon-days: ${PATHOME_VISIT_RESERVATION_HORIZON_DAYS:7}
    repair-horizon-hours: ${PATHOME_VISIT_REPAIR_HORIZON_HOURS:4}
    maximum-downstream-sessions: ${PATHOME_VISIT_MAX_DOWNSTREAM_SESSIONS:3}
    repair-retries: ${PATHOME_VISIT_REPAIR_RETRIES:2}
    alternate-ge-candidates: ${PATHOME_VISIT_ALTERNATE_GE_CANDIDATES:5}
    tenant-no-show-grace-minutes: ${PATHOME_VISIT_NO_SHOW_GRACE_MINUTES:15}
    minimum-contact-attempts: ${PATHOME_VISIT_MIN_CONTACT_ATTEMPTS:2}
    contact-attempt-spacing-minutes: ${PATHOME_VISIT_CONTACT_SPACING_MINUTES:5}
    tenant-dispute-window-hours: ${PATHOME_VISIT_DISPUTE_WINDOW_HOURS:24}
    silent-overrun-alert-minutes: ${PATHOME_VISIT_SILENT_OVERRUN_ALERT_MINUTES:15}
    maximum-operational-restores-per-day: ${PATHOME_VISIT_MAX_OPERATIONAL_RESTORES_PER_DAY:3}
    incomplete-outcome-grace-minutes: ${PATHOME_VISIT_INCOMPLETE_OUTCOME_GRACE_MINUTES:60}
    otp:
      digits: 6
      validity-minutes: ${PATHOME_VISIT_OTP_VALIDITY_MINUTES:10}
      regeneration-cooldown-seconds: ${PATHOME_VISIT_OTP_REGEN_COOLDOWN_SECONDS:30}
      maximum-attempts: ${PATHOME_VISIT_OTP_MAX_ATTEMPTS:5}
      key-id: ${PATHOME_VISIT_OTP_HMAC_KEY_ID:primary}
      hmac-secret: ${PATHOME_VISIT_OTP_HMAC_SECRET:}
      previous-key-id: ${PATHOME_VISIT_OTP_HMAC_PREVIOUS_KEY_ID:}
      previous-hmac-secret: ${PATHOME_VISIT_OTP_HMAC_PREVIOUS_SECRET:}
  scheduling:
    recommendation:
      version: ${PATHOME_SCHEDULING_POLICY_VERSION:2cb-v1}
      candidate-limit: ${PATHOME_SCHEDULING_CANDIDATE_LIMIT:5}
      candidate-step-minutes: ${PATHOME_SCHEDULING_CANDIDATE_STEP_MINUTES:15}
      maximum-candidate-starts: ${PATHOME_SCHEDULING_MAX_CANDIDATE_STARTS:256}
      maximum-planning-window-days: ${PATHOME_SCHEDULING_MAX_PLANNING_DAYS:14}
      maximum-ground-executives: ${PATHOME_SCHEDULING_MAX_GES:100}
      maximum-itinerary-stops: ${PATHOME_SCHEDULING_MAX_STOPS:20}
      maximum-reservation-rows: ${PATHOME_SCHEDULING_MAX_RESERVATIONS:5000}
      stop-dwell-minutes: ${PATHOME_SCHEDULING_STOP_DWELL_MINUTES:15}
      same-locality-travel-minutes: ${PATHOME_SCHEDULING_SAME_LOCALITY_MINUTES:5}
      same-city-travel-minutes: ${PATHOME_SCHEDULING_SAME_CITY_MINUTES:20}
      unknown-travel-minutes: ${PATHOME_SCHEDULING_UNKNOWN_TRAVEL_MINUTES:45}
      travel-buffer-minutes: ${PATHOME_SCHEDULING_TRAVEL_BUFFER_MINUTES:10}
      maximum-location-age-seconds: ${PATHOME_SCHEDULING_MAX_LOCATION_AGE_SECONDS:90}
      maximum-location-accuracy-meters: ${PATHOME_SCHEDULING_MAX_LOCATION_ACCURACY_METERS:100}
      maximum-location-future-relevance-minutes: ${PATHOME_SCHEDULING_LOCATION_RELEVANCE_MINUTES:120}
      coordinate-detour-factor: ${PATHOME_SCHEDULING_COORDINATE_DETOUR_FACTOR:1.5}
      conservative-travel-speed-kph: ${PATHOME_SCHEDULING_CONSERVATIVE_SPEED_KPH:15.0}
  guest:
    allowed-origins: ${PATHOME_GUEST_ALLOWED_ORIGINS:}
    retention-days: ${PATHOME_GUEST_RETENTION_DAYS:15}
    max-active-drafts-per-session: ${PATHOME_GUEST_MAX_ACTIVE_DRAFTS_PER_SESSION:1}
    max-drafts-per-ip-hour: ${PATHOME_GUEST_MAX_DRAFTS_PER_IP_HOUR:5}
    max-upload-attempts-per-ip-hour: ${PATHOME_GUEST_MAX_UPLOAD_ATTEMPTS_PER_IP_HOUR:30}
    max-media-files: ${PATHOME_GUEST_MAX_MEDIA_FILES:12}
    max-media-bytes: ${PATHOME_GUEST_MAX_MEDIA_BYTES:262144000}
  google-login:
    enabled: false
  staging:
    require-durable: ${PATHOME_STAGING_REQUIRE_DURABLE:false}
    local-path: ${PATHOME_STAGING_LOCAL_PATH:}
    s3:
      bucket: ${PATHOME_STAGING_S3_BUCKET:}
      region: ${PATHOME_STAGING_S3_REGION:us-east-005}
      endpoint: ${PATHOME_STAGING_S3_ENDPOINT:}
      access-key: ${PATHOME_STAGING_S3_ACCESS_KEY:}
      secret-key: ${PATHOME_STAGING_S3_SECRET_KEY:}
      path-style-access: ${PATHOME_STAGING_S3_PATH_STYLE:${PATHOME_STAGING_S3_PATH_STYLE_ACCESS:true}}
  draft-staging:
    s3:
      bucket: ${PATHOME_DRAFT_STAGING_S3_BUCKET:${PATHOME_STAGING_S3_BUCKET:}}
      region: ${PATHOME_DRAFT_STAGING_S3_REGION:${PATHOME_STAGING_S3_REGION:us-east-005}}
      endpoint: ${PATHOME_DRAFT_STAGING_S3_ENDPOINT:${PATHOME_STAGING_S3_ENDPOINT:}}
      access-key: ${PATHOME_DRAFT_STAGING_S3_ACCESS_KEY:${PATHOME_STAGING_S3_ACCESS_KEY:}}
      secret-key: ${PATHOME_DRAFT_STAGING_S3_SECRET_KEY:${PATHOME_STAGING_S3_SECRET_KEY:}}
      path-style-access: ${PATHOME_DRAFT_STAGING_S3_PATH_STYLE:${PATHOME_STAGING_S3_PATH_STYLE:true}}

# Threshold defaults are centralized in AutonomousLearningProperties.
search:
  learning:
    autonomous:
      enabled: ${SEARCH_LEARNING_AUTONOMOUS_ENABLED:true}
